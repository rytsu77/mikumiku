<script>
const $=s=>document.querySelector(s),S=Math.sin,PI=Math.PI,pick=a=>a[Math.floor(Math.random()*a.length)];
const cv=$('#cv'),c=cv.getContext('2d'),wrap=$('#wrap'),bub=$('#bubble'),bgm=$('#bgm');

const R=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
const E=(x,y,rx,ry,col)=>{for(let j=-ry;j<=ry;j++){const h=Math.round(rx*Math.sqrt(1-(j/(ry+.5))**2));R(x-h,y+j,2*h+1,1,col)}};
let name='',visits=0,t=0,mt=0,mode='idle',dur=0,X=innerWidth/2,Y=0,vy=0,vxs=0,pX=X,tgt=null,closeUp=false,started=false,

// ---- Voz sintetizada (no es su voz real): vocales con filtros de formantes ----
let ac,muted=false;
function tone(f,v,d,at,sl){const t0=ac.currentTime+at,o=ac.createOscillator(),out=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();
 o.type='sawtooth';o.frequency.setValueAtTime(f,t0);o.frequency.linearRampToValueAtTime(f*sl,t0+d);
 l.frequency.value=6;lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);
 out.gain.setValueAtTime(0,t0);out.gain.linearRampToValueAtTime(1.2,t0+.03);out.gain.exponentialRampToValueAtTime(.001,t0+d);
 for(const[i,fr]of({a:[800,1200],i:[300,2300],u:[350,1200],e:[500,1900],o:[500,900]}[v]).entries()){
  const b=ac.createBiquadFilter(),g=ac.createGain();b.type='bandpass';b.frequency.value=fr;b.Q.value=5;g.gain.value=i?.6:1;o.connect(b);b.connect(g);g.connect(out)}
 out.connect(ac.destination);[o,l].forEach(x=>{x.start(t0);x.stop(t0+d+.05)})}
function vc(seq){if(!ac||muted)return;let at=0;for(const[f,v,d,sl]of seq){tone(f,v,d,at,sl||1);at+=d*.9}}
const V={wave:[[784,'o',.2],[988,'a',.35]],think:[[330,'u',.6,.85]],hop:[[880,'i',.12,1.2],[1175,'i',.2]],
 dance:[[659,'a',.16],[784,'a',.16],[880,'a',.16],[784,'a',.16],[659,'a',.16],[988,'a',.35]],
 leek:[[784,'i',.14],[880,'i',.14],[988,'i',.14],[880,'i',.14],[784,'i',.14],[659,'i',.14],[784,'a',.35]]};

// ---- Poses: ángulos de brazos (0 = abajo, 3.14 = arriba) ----
function pose(m){
 const a=S(t*7),ph=t*10;
 const P={la:[.25+.05*S(t*2),.25],ra:[.25-.05*S(t*2),.25],bx:0,by:S(t*2)*.6,mo:0,tilt:0,lg:0,lf:9,lb:0,leek:0,open:0,dl:0};
 if(m==='walk'){P.la=[.3+.6*S(ph),.3+.6*S(ph)];P.ra=[.3-.6*S(ph),.3-.6*S(ph)];P.lg=3;P.lf=10;P.by=-Math.abs(S(ph));P.dl=.5}
 if(m==='wave'){P.ra=[2.5,2.5+.5*S(t*12)];P.mo=1}
 if(m==='think'){P.ra=[.9,-2.4];P.tilt=1}
 if(m==='dance'){P.la=[2+.6*a,2.2+.6*a];P.ra=[2-.6*a,2.2-.6*a];P.bx=2*S(t*3.5);P.by=-Math.abs(a)*2;P.lg=3;P.lf=7;P.mo=1;P.dl=1}
 if(m==='leek'){P.ra=[2.6,2.6];P.la=[.9,-.3];P.leek=1;P.bx=S(t*5);P.by=-Math.abs(S(t*5))*1.5;P.mo=1;P.dl=.6}
 if(m==='held'){P.la=[2.4+.4*S(t*9),2.4];P.ra=[2.4-.4*S(t*9),2.4];P.lg=2;P.lb=2;P.lf=8;P.open=1;P.mo=1;P.dl=1.5;P.by=0}
 if(m==='fall'){P.la=[2.3,2.3];P.ra=[2.3,2.3];P.lb=2;P.open=1;P.mo=1;P.dl=.8;P.by=0}
 if(m==='sleep'){P.sleep=1;P.nod=2;P.by=S(t)*.5}
 if(m==='sing'){P.mo=1;P.by=-1.5;P.la=[.5,.5];P.ra=[.5,.5]}
